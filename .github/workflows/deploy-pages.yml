name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/cool-noether-4yb04b, main]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
        env:
          # CI runners are slower than a laptop; scale the performance-test budgets
          PERF_SLACK: '4'

      - name: Type-check and build
        run: npm run build
        env:
          PAGES: '1'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
